name: Build ReaPack index

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install ReaPack indexer
        run: gem install reapack-index

      - name: Validate and update index
        run: |
          if ! output=$(reapack-index --scan . 2>&1); then
            echo "::error title=ReaPack scan failed::$output"
            exit 1
          fi
          echo "$output"
          if ! output=$(reapack-index --check . 2>&1); then
            echo "::error title=ReaPack validation failed::$output"
            exit 1
          fi
          echo "$output"

      - name: Commit updated index
        run: |
          if git diff --quiet -- index.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.xml
          git commit -m "Update ReaPack index [skip ci]"
          git push
